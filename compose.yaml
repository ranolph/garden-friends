services:
  garden-friends:
    build: .
    image: garden-friends:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${GARDEN_FRIENDS_BIND_IP:-0.0.0.0}:${GARDEN_FRIENDS_PORT:-8090}:8090"
    environment:
      GARDEN_FRIENDS_DATA_DIR: /data
      ART_DIR: /app/species_art
      WEB_BIND: 0.0.0.0
      WEB_PORT: "8090"
    volumes:
      - garden-friends-data:/data
      - type: bind
        source: ./species_art
        target: /app/species_art
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  garden-friends-data:
